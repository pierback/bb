name: Promote Pierback Desktop

on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Immutable candidate tag, for example pierback-desktop-v0.36.1"
        required: true
        type: string

env:
  NODE_VERSION: "22.x"

permissions:
  contents: write

concurrency:
  group: pierback-desktop-production
  cancel-in-progress: false

jobs:
  promote:
    name: Update NAS coordinator, smoke, then promote stable
    environment: pierback-production
    runs-on: [self-hosted, macOS, ARM64, pierback-signing]
    timeout-minutes: 45

    steps:
      - name: Checkout release automation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Expose the NAS runner toolchain
        run: deploy/desktop-release/expose-nas-runner-toolchain.sh

      - name: Validate immutable candidate tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.candidate_tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^pierback-desktop-v[0-9][0-9A-Za-z.+-]*$ ]]; then
            echo "::error::Unsafe Pierback candidate tag: $RELEASE_TAG"
            exit 1
          fi
          git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          automation_commit="$(git rev-parse HEAD)"
          source_commit="$(git rev-parse "$RELEASE_TAG^{commit}")"
          target_commit="$(gh release view "$RELEASE_TAG" --json targetCommitish --jq .targetCommitish)"
          if [[ "$target_commit" != "$source_commit" ]]; then
            echo "::error::Release target $target_commit did not match tag commit $source_commit."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$source_commit" "$automation_commit"; then
            echo "::error::Candidate $source_commit is not contained in the approved release-automation revision $automation_commit."
            exit 1
          fi
          {
            echo "automation_commit=$automation_commit"
            echo "source_commit=$source_commit"
            echo "tag=$RELEASE_TAG"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download and verify immutable candidate
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
        run: |
          set -euo pipefail
          release_directory="$(mktemp -d "$RUNNER_TEMP/pierback-promotion.XXXXXX")"
          gh release download "$RELEASE_TAG" --dir "$release_directory"
          source deploy/desktop-release/release-bundle.sh
          pierback_release_validate_directory "$release_directory"
          source_commit="$(node deploy/desktop-release/release-manifest.mjs "$release_directory/release-manifest.json" sourceCommit)"
          if [[ "$source_commit" != "${{ steps.candidate.outputs.source_commit }}" ]]; then
            echo "::error::Release manifest source $source_commit did not match the candidate tag."
            exit 1
          fi
          version="$(node deploy/desktop-release/release-manifest.mjs "$release_directory/release-manifest.json" desktopVersion)"
          if [[ "$RELEASE_TAG" != "pierback-desktop-v$version" ]]; then
            echo "::error::Candidate tag $RELEASE_TAG did not match manifest version $version."
            exit 1
          fi
          {
            echo "directory=$release_directory"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Reject a production downgrade
        env:
          CANDIDATE_VERSION: ${{ steps.bundle.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          stable_manifest="$RUNNER_TEMP/current-stable-release-manifest.json"
          status="$(curl --silent --show-error --max-time 10 \
            --output "$stable_manifest" \
            --write-out '%{http_code}' \
            https://updates.bb.staufingers.de/stable/release-manifest.json)"
          if [[ "$status" == "200" ]]; then
            stable_version="$(node deploy/desktop-release/release-manifest.mjs "$stable_manifest" desktopVersion)"
            node deploy/desktop-release/assert-release-promotion.mjs \
              "$CANDIDATE_VERSION" \
              "$stable_version"
          elif [[ "$status" == "404" ]]; then
            promoted_count="$(gh release list --limit 100 --json isPrerelease,tagName \
              --jq '[.[] | select(.isPrerelease == false and (.tagName | startswith("pierback-desktop-v")))] | length')"
            if [[ "$promoted_count" != "0" ]]; then
              echo "::error::Stable feed is missing despite an existing promoted Pierback release."
              exit 1
            fi
            echo "No prior stable Pierback release exists; allowing the initial promotion."
          else
            echo "::error::Could not establish current stable version (HTTP $status)."
            exit 1
          fi

      - name: Prepare pinned VPS SSH transport
        id: ssh
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.PIERBACK_VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.PIERBACK_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_SSH_KEY" || -z "$VPS_KNOWN_HOSTS" ]]; then
            echo "::error::Pierback VPS SSH credentials are required."
            exit 1
          fi
          ssh_directory="$RUNNER_TEMP/pierback-ssh-$GITHUB_RUN_ID"
          mkdir -m 0700 "$ssh_directory"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_directory/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 0600 "$ssh_directory/id" "$ssh_directory/known_hosts"
          {
            echo "key=$ssh_directory/id"
            echo "known_hosts=$ssh_directory/known_hosts"
          } >> "$GITHUB_OUTPUT"

      - name: Restage and verify the exact candidate on canary
        env:
          EXPECTED_VERSION: ${{ steps.bundle.outputs.version }}
          VPS_HOST: ${{ vars.PIERBACK_VPS_HOST }}
          VPS_USER: ${{ vars.PIERBACK_VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" ]]; then
            echo "::error::PIERBACK_VPS_HOST and PIERBACK_VPS_USER are required."
            exit 1
          fi
          deploy/desktop-release/upload-channel.sh \
            "${{ steps.bundle.outputs.directory }}" \
            "${{ steps.candidate.outputs.tag }}" \
            canary \
            "$VPS_USER@$VPS_HOST" \
            "${{ steps.ssh.outputs.key }}" \
            "${{ steps.ssh.outputs.known_hosts }}"

          headers="$RUNNER_TEMP/canary-headers.txt"
          manifest="$RUNNER_TEMP/canary-release-manifest.json"
          feed="$RUNNER_TEMP/canary-desktop-version.json"
          curl --fail --silent --show-error --dump-header "$headers" \
            https://updates.bb.staufingers.de/canary/desktop-version.json \
            --output "$feed"
          curl --fail --silent --show-error \
            https://updates.bb.staufingers.de/canary/release-manifest.json \
            --output "$manifest"
          if grep -Eiq '^location:|authelia' "$headers"; then
            echo "::error::Background update feed was redirected into interactive authentication."
            exit 1
          fi
          cmp -s "${{ steps.bundle.outputs.directory }}/release-manifest.json" "$manifest"
          node -e 'const fs = require("node:fs"); const feed = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (feed.channel !== "canary" || feed.version !== process.env.EXPECTED_VERSION) throw new Error("Public canary feed did not expose the candidate")' "$feed"

      - name: Preflight the stable publication boundary
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          VPS_HOST: ${{ vars.PIERBACK_VPS_HOST }}
          VPS_USER: ${{ vars.PIERBACK_VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" ]]; then
            echo "::error::PIERBACK_VPS_HOST and PIERBACK_VPS_USER are required."
            exit 1
          fi
          ssh_options=(
            -i "${{ steps.ssh.outputs.key }}"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=${{ steps.ssh.outputs.known_hosts }}"
          )
          local_sums="$(shasum -a 256 '${{ steps.bundle.outputs.directory }}/SHA256SUMS' | awk '{print $1}')"
          remote_sums="$(ssh "${ssh_options[@]}" "$VPS_USER@$VPS_HOST" \
            "test -w /srv/bb-updates/.incoming && test -f '/srv/bb-updates/releases/$RELEASE_TAG/SHA256SUMS' && sha256sum '/srv/bb-updates/releases/$RELEASE_TAG/SHA256SUMS'" \
            | awk '{print $1}')"
          if [[ "$remote_sums" != "$local_sums" ]]; then
            echo "::error::The VPS canary release does not match the immutable candidate bundle."
            exit 1
          fi

      - name: Initialize durable promotion state
        id: state
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          promotion_state_root="${PIERBACK_PROMOTION_STATE_ROOT:-$HOME/.bb/pierback-release-promotions}"
          # One NAS has one mutable coordinator database. Its promotion journal
          # must therefore be host-global: a different candidate tag cannot
          # bypass an interrupted recovery transaction.
          promotion_state_path="$promotion_state_root/nas-coordinator.json"
          node deploy/desktop-release/promotion-state.mjs assert-legacy-safe \
            "$promotion_state_root"
          phase="$(node deploy/desktop-release/promotion-state.mjs initialize \
            "$promotion_state_path" \
            "$RELEASE_TAG" \
            "$RELEASE_VERSION" \
            "$SOURCE_COMMIT")"
          case "$phase" in
            prepared)
              needs_nas=true
              needs_stable=true
              needs_complete=true
              recovery_blocked=false
              ;;
            nas-installing | recovery-required)
              needs_nas=false
              needs_stable=false
              needs_complete=false
              recovery_blocked=true
              ;;
            nas-installed)
              needs_nas=false
              needs_stable=true
              needs_complete=true
              recovery_blocked=false
              ;;
            stable-verified)
              needs_nas=false
              needs_stable=false
              needs_complete=true
              recovery_blocked=false
              ;;
            complete)
              needs_nas=false
              needs_stable=false
              needs_complete=false
              recovery_blocked=false
              ;;
            *)
              echo "::error::Unknown Pierback promotion phase: $phase"
              exit 1
              ;;
          esac
          {
            echo "needs_complete=$needs_complete"
            echo "needs_nas=$needs_nas"
            echo "needs_stable=$needs_stable"
            echo "path=$promotion_state_path"
            echo "phase=$phase"
            echo "recovery_blocked=$recovery_blocked"
          } >> "$GITHUB_OUTPUT"

      - name: Block unsafe promotion retry until recovery is acknowledged
        if: steps.state.outputs.recovery_blocked == 'true'
        run: |
          echo "::error::Promotion phase ${{ steps.state.outputs.phase }} requires manual NAS database recovery acknowledgement. Do not rerun the installer."
          exit 1

      - name: Install or verify NAS coordinator and machine bootstrap
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.state.outputs.needs_nas }}" == "true" ]]; then
            node deploy/desktop-release/promotion-state.mjs advance \
              "${{ steps.state.outputs.path }}" \
              "$RELEASE_TAG" \
              "$RELEASE_VERSION" \
              "$SOURCE_COMMIT" \
              prepared \
              nas-installing
            # The installer keeps rollback armed until version, protocol, and
            # the runtime-generated bb-app.tgz have all passed.
            deploy/desktop-release/install-nas-candidate.sh \
              "${{ steps.bundle.outputs.directory }}" \
              "${{ steps.state.outputs.path }}"
            phase="$(node deploy/desktop-release/promotion-state.mjs initialize \
              "${{ steps.state.outputs.path }}" \
              "$RELEASE_TAG" \
              "$RELEASE_VERSION" \
              "$SOURCE_COMMIT")"
            if [[ "$phase" != "nas-installed" ]]; then
              echo "::error::NAS installer returned from unexpected promotion phase $phase."
              exit 1
            fi
          else
            response="$(curl --fail --silent --show-error --max-time 5 http://127.0.0.1:38886/install/version)"
            printf '%s' "$response" | node deploy/desktop-release/verify-coordinator-response.mjs \
              "$RELEASE_VERSION" \
              "$(node deploy/desktop-release/release-manifest.mjs '${{ steps.bundle.outputs.directory }}/release-manifest.json' hostDaemonProtocolVersion)"
            bootstrap_tarball="$RUNNER_TEMP/nas-coordinator-bb-app.tgz"
            curl --fail --silent --show-error --location --max-time 180 \
              http://127.0.0.1:38886/install/bb-app.tgz \
              --output "$bootstrap_tarball"
            node deploy/desktop-release/verify-bb-app-tarball.mjs \
              "$bootstrap_tarball" \
              "$RELEASE_VERSION"
          fi

      - name: Promote the same bytes to stable
        if: steps.state.outputs.needs_stable == 'true'
        env:
          VPS_HOST: ${{ vars.PIERBACK_VPS_HOST }}
          VPS_USER: ${{ vars.PIERBACK_VPS_USER }}
        run: |
          set -euo pipefail
          if [[ -z "$VPS_HOST" || -z "$VPS_USER" ]]; then
            echo "::error::PIERBACK_VPS_HOST and PIERBACK_VPS_USER are required."
            exit 1
          fi
          deploy/desktop-release/upload-channel.sh \
            "${{ steps.bundle.outputs.directory }}" \
            "${{ steps.candidate.outputs.tag }}" \
            stable \
            "$VPS_USER@$VPS_HOST" \
            "${{ steps.ssh.outputs.key }}" \
            "${{ steps.ssh.outputs.known_hosts }}"

      - name: Smoke public stable feed without interactive auth
        env:
          EXPECTED_VERSION: ${{ steps.bundle.outputs.version }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          headers="$RUNNER_TEMP/stable-headers.txt"
          manifest="$RUNNER_TEMP/stable-release-manifest.json"
          feed="$RUNNER_TEMP/stable-desktop-version.json"
          curl --fail --silent --show-error --dump-header "$headers" https://updates.bb.staufingers.de/stable/desktop-version.json --output "$feed"
          curl --fail --silent --show-error https://updates.bb.staufingers.de/stable/release-manifest.json --output "$manifest"
          if grep -Eiq '^location:|authelia' "$headers"; then
            echo "::error::Background update feed was redirected into interactive authentication."
            exit 1
          fi
          cmp -s "${{ steps.bundle.outputs.directory }}/release-manifest.json" "$manifest"
          node -e 'const fs = require("node:fs"); const feed = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (feed.channel !== "stable" || feed.version !== process.env.EXPECTED_VERSION) throw new Error("Public stable feed did not expose the promoted candidate")' "$feed"
          phase="$(node deploy/desktop-release/promotion-state.mjs initialize \
            '${{ steps.state.outputs.path }}' \
            "$RELEASE_TAG" \
            "$EXPECTED_VERSION" \
            "$SOURCE_COMMIT")"
          if [[ "$phase" == "nas-installed" ]]; then
            node deploy/desktop-release/promotion-state.mjs advance \
              "${{ steps.state.outputs.path }}" \
              "$RELEASE_TAG" \
              "$EXPECTED_VERSION" \
              "$SOURCE_COMMIT" \
              nas-installed \
              stable-verified
          elif [[ "$phase" != "stable-verified" && "$phase" != "complete" ]]; then
            echo "::error::Stable verification reached unexpected promotion phase $phase."
            exit 1
          fi

      - name: Mark or verify GitHub candidate as promoted
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          set -euo pipefail
          if [[ "${{ steps.state.outputs.needs_complete }}" == "true" ]]; then
            gh release edit "$RELEASE_TAG" --prerelease=false --latest
            node deploy/desktop-release/promotion-state.mjs advance \
              "${{ steps.state.outputs.path }}" \
              "$RELEASE_TAG" \
              "$RELEASE_VERSION" \
              "$SOURCE_COMMIT" \
              stable-verified \
              complete
          elif [[ "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" != "false" ]]; then
            echo "::error::Completed promotion state disagrees with the GitHub release."
            exit 1
          fi

      - name: Report durable promotion phase after failure
        if: failure() && steps.state.outcome == 'success'
        env:
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.bundle.outputs.version }}
          SOURCE_COMMIT: ${{ steps.candidate.outputs.source_commit }}
        run: |
          phase="$(node deploy/desktop-release/promotion-state.mjs initialize \
            '${{ steps.state.outputs.path }}' \
            "$RELEASE_TAG" \
            "$RELEASE_VERSION" \
            "$SOURCE_COMMIT")"
          if [[ "$phase" == "nas-installing" || "$phase" == "recovery-required" ]]; then
            {
              echo "## Manual NAS recovery required"
              echo
              echo "- durable phase: $phase"
              echo "- candidate: $RELEASE_TAG"
              echo "- do not rerun this promotion until the pre-cutover database and coordinator have been restored and validated"
              echo "- after recovery, explicitly run promotion-state.mjs acknowledge-recovery for this exact state path and candidate identity"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Pierback promotion paused safely"
              echo
              echo "- durable phase: $phase"
              echo "- candidate: $RELEASE_TAG"
              echo "- recovery: rerun this workflow with the same immutable candidate tag"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Summarize promotion
        run: |
          {
            echo "## Pierback promoted"
            echo
            echo "- immutable tag: ${{ steps.candidate.outputs.tag }}"
            echo "- NAS coordinator updated and protocol-smoked first"
            echo "- exact candidate bytes promoted to: https://updates.bb.staufingers.de/stable/"
            echo "- stable Macs will download in the background and install on restart"
          } >> "$GITHUB_STEP_SUMMARY"

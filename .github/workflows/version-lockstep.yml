name: Version Lockstep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check bb-app and desktop versions
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Check version lockstep
        run: node .github/workflows/check-version-lockstep.mjs

      - name: Reject Pierback identity leaks
        run: node .github/workflows/check-pierback-identity.mjs

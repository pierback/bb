name: Build Pierback Desktop Candidate

on:
  workflow_dispatch:

env:
  BB_DESKTOP_BUILD_FLAVOR: release
  CSC_IDENTITY_AUTO_DISCOVERY: "false"
  NODE_VERSION: "22.x"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: write

concurrency:
  group: pierback-desktop-candidate-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Sign, notarize, and publish canary candidate
    environment: pierback-canary
    runs-on: [self-hosted, macOS, ARM64, pierback-signing]
    timeout-minutes: 90

    steps:
      - name: Checkout approved fork revision
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the fork default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]]; then
            echo "::error::Pierback candidates may only be built from $DEFAULT_BRANCH after its pull request is approved."
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Resolve immutable candidate identity
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./apps/desktop/package.json').version")"
          node -e 'const version = process.argv[1]; if (!/^(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)\.(?:0|[1-9]\d*)$/.test(version)) throw new Error(`Stable Pierback candidates require plain SemVer, got ${version}`)' "$version"
          tag="pierback-desktop-v$version"
          release_json="$RUNNER_TEMP/pierback-existing-release.json"
          release_error="$RUNNER_TEMP/pierback-existing-release.error"
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$release_json" 2> "$release_error"; then
            target_commit="$(node -p "JSON.parse(require('node:fs').readFileSync(process.argv[1], 'utf8')).target_commitish" "$release_json")"
            if [[ "$target_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::Immutable release $tag targets $target_commit, not $GITHUB_SHA. Bump the desktop version."
              exit 1
            fi
            reuse=true
          elif grep -Eq 'HTTP 404|release not found|Not Found' "$release_error"; then
            reuse=false
          else
            cat "$release_error" >&2
            echo "::error::Could not determine whether immutable release $tag already exists."
            exit 1
          fi
          {
            echo "reuse=$reuse"
            echo "tag=$tag"
            echo "version=$version"
          } >> "$GITHUB_OUTPUT"

      - name: Verify NAS signing worker and release credentials
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ vars.PIERBACK_SIGNING_IDENTITY }}
          REUSE_CANDIDATE: ${{ steps.candidate.outputs.reuse }}
          VPS_HOST: ${{ vars.PIERBACK_VPS_HOST }}
          VPS_KNOWN_HOSTS: ${{ secrets.PIERBACK_VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.PIERBACK_VPS_SSH_KEY }}
          VPS_USER: ${{ vars.PIERBACK_VPS_USER }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = "Darwin"
          test "$(uname -m)" = "arm64"
          required=(
            VPS_HOST
            VPS_KNOWN_HOSTS
            VPS_SSH_KEY
            VPS_USER
          )
          if [[ "$REUSE_CANDIDATE" != "true" ]]; then
            required+=(
              APPLE_APP_SPECIFIC_PASSWORD
              APPLE_ID
              APPLE_TEAM_ID
              CSC_NAME
            )
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing Pierback release credential or variable: $name"
              exit 1
            fi
          done
          if [[ "$REUSE_CANDIDATE" != "true" ]]; then
            if [[ "${ACTIONS_RUNNER_SVC:-}" == "1" ]]; then
              echo "::error::The Pierback macOS signing runner must start through run.sh in the logged-in user's LaunchAgent, not GitHub's service wrapper. Service mode can see the identity but cannot reliably use its private key."
              exit 1
            fi
            if [[ "$CSC_NAME" == "Developer ID Application:"* ]]; then
              echo '::error::PIERBACK_SIGNING_IDENTITY must omit the "Developer ID Application:" prefix. Use only the certificate owner selector.'
              exit 1
            fi
            security find-identity -v -p codesigning | grep -F -- "$CSC_NAME" > /dev/null
            codesign_probe_directory="$(mktemp -d "$RUNNER_TEMP/pierback-codesign-probe.XXXXXX")"
            trap 'rm -R -- "$codesign_probe_directory"' EXIT
            cp /usr/bin/true "$codesign_probe_directory/probe"
            /usr/bin/codesign --force --timestamp --options runtime --sign "$CSC_NAME" "$codesign_probe_directory/probe"
            /usr/bin/codesign --verify --strict --verbose=2 "$codesign_probe_directory/probe"
            rm -R -- "$codesign_probe_directory"
            trap - EXIT
          fi

      - name: Install dependencies
        if: steps.candidate.outputs.reuse != 'true'
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Verify lockstep versions
        if: steps.candidate.outputs.reuse != 'true'
        run: node .github/workflows/check-version-lockstep.mjs

      - name: Typecheck release surfaces
        if: steps.candidate.outputs.reuse != 'true'
        run: pnpm exec turbo run typecheck --filter=@bb/desktop-contract --filter=@bb/app --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Test release surfaces
        if: steps.candidate.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          pnpm exec turbo run test --filter=@bb/desktop-contract --filter=@bb/app --filter=@bb/desktop --filter=bb-app --force --output-logs=new-only
          node --test \
            deploy/desktop-release/promotion-state.test.mjs \
            deploy/desktop-release/publish-channel.test.mjs \
            deploy/desktop-release/release-automation.test.mjs \
            deploy/desktop-release/release-manifest.test.mjs \
            deploy/desktop-release/verify-bb-app-tarball.test.mjs
          node deploy/pwa-gateway/test-routing.mjs
          for script in \
            deploy/desktop-release/release-bundle.sh \
            deploy/desktop-release/publish-channel.sh \
            deploy/desktop-release/upload-channel.sh \
            deploy/desktop-release/install-nas-candidate.sh; do
            bash -n "$script"
          done

      - name: Build desktop and PWA runtime
        if: steps.candidate.outputs.reuse != 'true'
        run: pnpm exec turbo run build --filter=@bb/desktop --filter=bb-app --output-logs=new-only

      - name: Sign and notarize Pierback arm64 artifacts
        if: steps.candidate.outputs.reuse != 'true'
        env:
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_NAME: ${{ vars.PIERBACK_SIGNING_IDENTITY }}
        run: pnpm --filter @bb/desktop run desktop:build

      - name: Smoke packaged Pierback
        if: steps.candidate.outputs.reuse != 'true'
        run: pnpm --filter @bb/desktop run smoke:packaged

      - name: Prepare immutable release bundle
        if: steps.candidate.outputs.reuse != 'true'
        env:
          PIERBACK_RELEASE_SOURCE_COMMIT: ${{ github.sha }}
        run: pnpm --filter @bb/desktop run desktop:release-bundle

      - name: Verify signed and notarized app
        if: steps.candidate.outputs.reuse != 'true'
        run: |
          set -euo pipefail
          app="apps/desktop/release/mac-arm64/Pierback.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")" = "de.staufingers.pierback.desktop"

      - name: Resolve exact release bundle
        id: bundle
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
          REUSE_CANDIDATE: ${{ steps.candidate.outputs.reuse }}
        run: |
          set -euo pipefail
          source deploy/desktop-release/release-bundle.sh
          if [[ "$REUSE_CANDIDATE" = "true" ]]; then
            release_directory="$(mktemp -d "$RUNNER_TEMP/pierback-existing.XXXXXX")"
            gh release download "$RELEASE_TAG" --dir "$release_directory"
          else
            release_directory="apps/desktop/release"
          fi
          pierback_release_validate_directory "$release_directory"
          source_commit="$(node deploy/desktop-release/release-manifest.mjs "$release_directory/release-manifest.json" sourceCommit)"
          manifest_version="$(node deploy/desktop-release/release-manifest.mjs "$release_directory/release-manifest.json" desktopVersion)"
          test "$source_commit" = "$GITHUB_SHA"
          test "$manifest_version" = "$RELEASE_VERSION"
          echo "directory=$release_directory" >> "$GITHUB_OUTPUT"

      - name: Create or verify immutable GitHub candidate release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.candidate.outputs.tag }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          release_directory="${{ steps.bundle.outputs.directory }}"
          source deploy/desktop-release/release-bundle.sh
          pierback_release_validate_directory "$release_directory"
          release_assets=("$release_directory/SHA256SUMS")
          for name in "${PIERBACK_RELEASE_MANIFEST_NAMES[@]}"; do
            release_assets+=("$release_directory/$name")
          done

          if [[ "${{ steps.candidate.outputs.reuse }}" = "true" ]]; then
            echo "Verified existing immutable candidate $RELEASE_TAG for a safe deployment retry."
          else
            protocol="$(node deploy/desktop-release/release-manifest.mjs "$release_directory/release-manifest.json" hostDaemonProtocolVersion)"
            gh release create "$RELEASE_TAG" "${release_assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "Pierback Desktop $RELEASE_VERSION" \
              --notes "Signed and notarized Pierback Desktop $RELEASE_VERSION candidate from $GITHUB_SHA. Host protocol: $protocol. Promote only after NAS-first verification." \
              --prerelease
          fi

      - name: Upload candidate workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.candidate.outputs.tag }}
          path: |
            ${{ steps.bundle.outputs.directory }}/pierback-*.dmg
            ${{ steps.bundle.outputs.directory }}/pierback-*.zip
            ${{ steps.bundle.outputs.directory }}/pierback-*.blockmap
            ${{ steps.bundle.outputs.directory }}/canary-mac.yml
            ${{ steps.bundle.outputs.directory }}/stable-mac.yml
            ${{ steps.bundle.outputs.directory }}/canary-desktop-version.json
            ${{ steps.bundle.outputs.directory }}/stable-desktop-version.json
            ${{ steps.bundle.outputs.directory }}/release-manifest.json
            ${{ steps.bundle.outputs.directory }}/SHA256SUMS
          if-no-files-found: error

      - name: Prepare pinned VPS SSH transport
        id: ssh
        env:
          VPS_KNOWN_HOSTS: ${{ secrets.PIERBACK_VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.PIERBACK_VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          ssh_directory="$RUNNER_TEMP/pierback-ssh-$GITHUB_RUN_ID"
          mkdir -m 0700 "$ssh_directory"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_directory/id"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_directory/known_hosts"
          chmod 0600 "$ssh_directory/id" "$ssh_directory/known_hosts"
          {
            echo "key=$ssh_directory/id"
            echo "known_hosts=$ssh_directory/known_hosts"
          } >> "$GITHUB_OUTPUT"

      - name: Publish exact candidate artifacts to canary
        env:
          VPS_HOST: ${{ vars.PIERBACK_VPS_HOST }}
          VPS_USER: ${{ vars.PIERBACK_VPS_USER }}
        run: |
          deploy/desktop-release/upload-channel.sh \
            "${{ steps.bundle.outputs.directory }}" \
            "${{ steps.candidate.outputs.tag }}" \
            canary \
            "$VPS_USER@$VPS_HOST" \
            "${{ steps.ssh.outputs.key }}" \
            "${{ steps.ssh.outputs.known_hosts }}"

      - name: Smoke public canary feed
        env:
          EXPECTED_VERSION: ${{ steps.candidate.outputs.version }}
        run: |
          set -euo pipefail
          manifest="$RUNNER_TEMP/public-canary-release-manifest.json"
          feed="$RUNNER_TEMP/public-canary-desktop-version.json"
          curl --fail --silent --show-error --location https://updates.bb.staufingers.de/canary/release-manifest.json --output "$manifest"
          curl --fail --silent --show-error --location https://updates.bb.staufingers.de/canary/desktop-version.json --output "$feed"
          cmp -s "${{ steps.bundle.outputs.directory }}/release-manifest.json" "$manifest"
          node -e 'const fs = require("node:fs"); const feed = JSON.parse(fs.readFileSync(process.argv[1], "utf8")); if (feed.channel !== "canary" || feed.version !== process.env.EXPECTED_VERSION) throw new Error("Public canary feed did not expose the candidate")' "$feed"

      - name: Summarize candidate
        run: |
          {
            echo "## Pierback candidate ready"
            echo
            echo "- immutable tag: ${{ steps.candidate.outputs.tag }}"
            echo "- source: $GITHUB_SHA"
            echo "- signed and notarized on the NAS runner"
            echo "- published to: https://updates.bb.staufingers.de/canary/"
            echo "- stable is unchanged; run **Promote Pierback Desktop** after canary approval"
          } >> "$GITHUB_STEP_SUMMARY"
